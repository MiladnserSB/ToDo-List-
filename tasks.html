<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./vendors/bootstrap v5.3.0/bootstrap.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>ToDo List</title>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="">B4F</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="index.html">Users</a>
              <a class="nav-link active" aria-current="page" href="tasks.html"
                >Tasks</a
              >
            </div>
          </div>
        </div>
      </nav>
    </div>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center my-4">
        <h3 class="page-title mb-0">Tasks</h3>
        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#exampleModal"
          id="addtask"
        >
          ADD TASK
        </button>
      </div>

      <!-- Modal -->
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                Add new Task
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div id="myForm">
                <form action="">
                  <div class="mb-3">
                    <label for="taskTitle" class="form-label">Task Title</label>
                    <input type="text" class="form-control" id="taskTitle" />
                  </div>
                  <div class="mb-3">
                    <label for="taskDescription" class="form-label"
                      >Description</label
                    >
                    <textarea
                      class="form-control"
                      id="taskDescription"
                      rows="3"
                    ></textarea>
                  </div>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="taskStatus" class="form-label">Status</label>
                      <select class="form-select" id="taskStatus">
                        <option value="pending">pending</option>
                        <option value="in_progress" selected>
                          in_progress
                        </option>
                        <option value="complete">complete</option>
                      </select>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="taskPriority" class="form-label"
                        >Priority</label
                      >
                      <select class="form-select" id="taskPriority">
                        <option value="low">low</option>
                        <option value="medium" selected>medium</option>
                        <option value="high">high</option>
                      </select>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="taskAssignedUsers" class="form-label"
                      >Assigned Users</label
                    >
                    <select class="form-select" id="taskAssignedUsers" multiple>
                      <option value="u_001"></option>
                    </select>
                    <div class="form-text"></div>
                  </div>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="taskDueDate" class="form-label"
                        >Due Date</label
                      >
                      <input
                        type="date"
                        class="form-control"
                        id="taskDueDate"
                      />
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="taskTags" class="form-label">Tags</label>
                      <input type="text" class="form-control" id="taskTags" />
                    </div>
                  </div>
                </form>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">Add</button>
            </div>
          </div>
        </div>
      </div>

      <div id="containbutton" class="btn-group mb-4" role="group">
        <button class="btn btn-outline-primary" type="button">ALL</button>
        <button class="btn btn-outline-primary" type="button">Panding</button>
        <button class="btn btn-outline-primary" type="button">Improse</button>
        <button class="btn btn-outline-primary" type="button">Complete</button>
      </div>

      <div class="surface-card p-3 p-md-4 mb-5" id="tableContainer">
        <div class="table-responsive">
          <table class="table table-striped" id="taskTable"></table>
        </div>
      </div>
    </div>

    <script src="./vendors/bootstrap v5.3.0/bootstrap.bundle.js"></script>
    <script src="./js/tasks.js" type="module"></script>
  </body>
</html>
