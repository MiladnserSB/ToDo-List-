<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./vendors/bootstrap v5.3.0/bootstrap.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>ToDo List</title>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="">B4F</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="index.html">Users</a>
              <a class="nav-link active" aria-current="page" href="tasks.html"
                >Tasks</a
              >
            </div>
          </div>
        </div>
      </nav>
    </div>
    <div class="container">
      <!-- Button trigger modal -->
       <div id="center">
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#exampleModal"
        id="addtask"
      >
        ADD TASK
      </button>
      <button class="btn btn-primary" id="updtae" type="button">Update</button>
      <button class="btn btn-primary"  
      id="delete" type="button">Delete</button>
          </div>

      <!-- Modal -->
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                Add new Task
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div id="myForm">
                <form action="">
                  <label for="usweName">Name:</label>
                  <input
                    type="text"
                    id="userName"
                    placeholder="Enter your Name"
                  />
                  <br />
                  <br>
                  <label for="Age">Age:</label>
                  <input
                    type="number"
                    id="Age"
                    min="0"
                    max="100"
                    placeholder="Enter tour Age"
                  />
                  <br />
                  <br>
                  <label for="gender">Gender:</label>
                  <select name="Gender" id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                  </select>
                </form>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">Add</button>
            </div>
          </div>
        </div>
      </div>
      <div><br /></div>
    </div>
    <div class="container">
      <!-- <a class="btn btn-primary" id="mowafak" href="#" role="button">Link</a> -->
      <button class="btn btn-primary" type="button">ALL</button>
       <button class="btn btn-primary" type="button">Panding</button>
        <button class="btn btn-primary" type="button">Improse</button>
         <button class="btn btn-primary" type="button">Complete</button>
      
    </div>
    <div class="container">
      <table class="table table-striped">
        <thead>
          <tr>
            <th scope="col">User Name</th>
            <th scope="col">Gender</th>
            <th scope="col">Task Title</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody class="table-group-divider">
          <tr>
            <th scope="row">1</th>
            <td>Mark</td>
            <td>Otto</td>
            <td>@mdo</td>
          </tr>
          <tr>
            <th scope="row">2</th>
            <td>Jacob</td>
            <td>Thornton</td>
            <td>@fat</td>
          </tr>
          <tr>
            <th scope="row">3</th>
            <td>John</td>
            <td>Doe</td>
            <td>@social</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="./vendors/bootstrap v5.3.0/bootstrap.bundle.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
