<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./vendors/bootstrap v5.3.0/bootstrap.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>ToDo List</title>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="">B4F</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Users</a
              >
              <a class="nav-link" href="tasks.html">Tasks</a>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center my-4">
        <h3 class="page-title mb-0">Users</h3>
        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#addUserModal"
          id="addtask"
        >
          ADD USER
        </button>
      </div>

      <!-- Add User Modal -->
      <div
        class="modal fade"
        id="addUserModal"
        tabindex="-1"
        aria-labelledby="addUserModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="addUserModalLabel">
                Add new User
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="userForm">
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" class="form-control" id="name" />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" />
                </div>
                <div class="mb-3">
                  <label for="phone" class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" />
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role">
                      <option value="developer" selected>Developer</option>
                      <option value="designer">Designer</option>
                      <option value="manager">Manager</option>
                      <option value="qa">QA</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="department" class="form-label"
                      >Department</label
                    >
                    <input type="text" class="form-control" id="department" />
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="submit" form="userForm" class="btn btn-primary" id="add-user-btn">
                Add
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="surface-card p-3 p-md-4 mb-5" id="tableContainer">
        <div class="table-responsive">
          <table class="table table-striped" id="userTable"></table>
        </div>
      </div>
    </div>
    <script src="./vendors/bootstrap v5.3.0/bootstrap.bundle.js"></script>
    <script src="./js/users.js" type="module"></script>
  </body>
</html>
